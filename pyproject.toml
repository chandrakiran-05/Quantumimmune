[project]
name = "quantumimmune"
version = "0.1.0"
description = "QuantumImmune Dx Backend"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "joblib>=1.3",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "anthropic>=0.18.0"
]

[tool.vercel]
entrypoint = "backend.main:app"
